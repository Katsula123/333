  <style>
    :root {
      --bg: #101115;
      --card: #1d2026;
      --card-hover: #292d35;
      --text: #f5f5f5;
      --muted: #a5a8b1;
      --red: #e53935;

    }

    * {

    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft JhengHei", "Noto Sans TC",

      line-height: 1.7;
    }

    a {

      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .container {

      margin: auto;
    }

    /* 網站頂部 */
    header {
      background: #14161b;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 0;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }

    .logo span {
      color: var(--red);
    }

    .logo small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    .header-right {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .header-right strong {
      color: #75d8a7;
      font-weight: 500;
    }

      background: #1a1c22;
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-inner::-webkit-scrollbar {
      display: none;
    }

      flex-shrink: 0;
      padding: 13px 18px;
      font-size: 14px;
      color: #c3c5cb;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }

    .nav-link:hover,

      color: white;
      border-bottom-color: var(--red);
    }

      position: relative;
      min-height: 430px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #333841, #14161b);
      display: flex;
      align-items: flex-end;
      cursor: pointer;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    .hero:hover img {
      transform: scale(1.04);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.94),
        rgba(0,0,0,0.28) 60%,
        rgba(0,0,0,0.08)
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 38px;
      max-width: 850px;
    }

    .tag {
      display: inline-block;
      background: var(--red);
      color: white;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 3px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: clamp(25px, 4vw, 40px);
      line-height: 1.35;
      margin: 14px 0;
    }

    .hero p {
      color: #dadce1;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    /* 分類與新聞區 */
    .section {
      margin: 46px auto;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 13px;

    .section-heading h2 {

      padding-left: 14px;
      border-left: 4px solid var(--red);
    }

    .section-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 23px;
    }

    .news-card {

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;

</head>

    /* -----------------------------------
       安全處理文字和網址
    ----------------------------------- */

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function safeUrl(value) {
      if (!value || typeof value !== "string") return "";

      try {
        const url = new URL(value, document.baseURI);

        if (url.protocol === "https:" ||
            url.protocol === "http:") {
          return url.href;
        }
      } catch (error) {
        return "";
      }

      return "";
    }

    function formatDate(value) {
      if (!value) return "日期未提供";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date);
    }

    function getCategoryName(key) {
      return CATEGORY_NAMES[key] || "車壇新聞";
    }

    function getParagraphs(content) {
      if (Array.isArray(content)) {
        return content.filter(
          (item) => typeof item === "string" && item.trim()
        );
      }

      if (typeof content === "string") {
        return content
          .split(/\n+/)
          .filter((item) => item.trim());
      }

      return [];
    }

    /* -----------------------------------
       圖片處理
    ----------------------------------- */

      const url = safeUrl(article.image);

      if (!url) {
        return `
          <div class="no-image">
            MOTOR DAILY
          </div>
        `;
      }

      return `
        <img
          class="${className}"
          src="${escapeHTML(url)}"
          alt="${escapeHTML(article.imageAlt || article.title)}"
          loading="lazy"
          referrerpolicy="no-referrer"
          onerror="this.style.display='none';
                   this.parentElement.classList.add('image-error')"
        >
      `;
    }

    /* -----------------------------------
       排序新聞
    ----------------------------------- */

    function sortArticles(articles) {
      return [...articles].sort((a, b) => {
        const timeA = Date.parse(a.date) || 0;
        const timeB = Date.parse(b.date) || 0;
        return timeB - timeA;
      });
    }

    function getFeaturedArticle(articles) {
      if (!articles.length) return null;

      return articles.find(
        (article) => article.featured === true
      ) || articles[0];
    }

    /* -----------------------------------
       顯示首頁焦點新聞
    ----------------------------------- */

    function renderHero() {
      const article = getFeaturedArticle(state.articles);
      const hero = $("hero");

      if (!article) {
        hero.hidden = true;
        return;
      }

      hero.hidden = false;

      $("heroTitle").textContent = article.title;
      $("heroSummary").textContent = article.summary || "";
      $("heroMeta").textContent =
        `${formatDate(article.date)}｜${article.source || "未標示來源"}`;

      const heroImage = $("heroImage");
      const url = safeUrl(article.image);

      if (url) {
        heroImage.src = url;
        heroImage.alt = article.imageAlt || article.title;
        heroImage.hidden = false;

        heroImage.onerror = () => {
          heroImage.hidden = true;
        };
      } else {
        heroImage.hidden = true;
      }

      hero.onclick = () => {
        window.location.hash =
          "#article/" + encodeURIComponent(article.id);
      };

      hero.setAttribute("role", "link");
      hero.setAttribute("tabindex", "0");

      hero.onkeydown = (event) => {
        if (event.key === "Enter") {
          hero.click();
        }
      };
    }

    /* -----------------------------------
       建立新聞卡片
    ----------------------------------- */

    function createNewsCard(article) {
      const link = "#article/" + encodeURIComponent(article.id);

      return `
        <a class="news-card" href="${escapeHTML(link)}">

          <div class="card-image">
            ${imageHTML(article)}
          </div>

          <div class="card-body">

            <span class="category">
              ${escapeHTML(getCategoryName(article.category))}
            </span>

            <h3>${escapeHTML(article.title)}</h3>

            <p>${escapeHTML(article.summary || "")}</p>

            <div class="card-bottom">
              <span>${escapeHTML(formatDate(article.date))}</span>
              <span class="read-more">閱讀全文 →</span>
            </div>

          </div>

        </a>
      `;
    }

    /* -----------------------------------
       顯示新聞列表
    ----------------------------------- */

    function renderNewsList(category = "all") {
      let articles = sortArticles(state.articles);

      if (category !== "all") {
        articles = articles.filter(
          (article) => article.category === category
        );
      }

      $("listTitle").textContent =
        category === "all"
          ? "最新新聞"
          : getCategoryName(category);

      $("articleCount").textContent =
        `共 ${articles.length} 篇文章`;

      if (!articles.length) {
        $("newsGrid").innerHTML = `
          <div class="empty-state">
            <h3>目前沒有相關新聞</h3>
            <p>請稍後再查看最新消息。</p>
          </div>
        `;
      } else {
        $("newsGrid").innerHTML =
          articles.map(createNewsCard).join("");
      }

      $("hero").hidden = category !== "all";

      if (category === "all") {
        renderHero();
      }
    }

    /* -----------------------------------
       顯示單篇文章
    ----------------------------------- */

    function renderArticle(articleId) {
      const article = state.articles.find(
        (item) => String(item.id) === articleId
      );

      $("homePage").hidden = true;
      $("articlePage").hidden = false;

      if (!article) {
        $("articlePage").innerHTML = `
          <a class="back-link" href="#home">← 返回首頁</a>
          <div class="empty-state">
            <h3>找不到這篇文章</h3>
            <p>文章可能尚未發布，或已經移除。</p>
          </div>
        `;
        return;
      }

      const paragraphs = getParagraphs(article.content);

      const bodyHTML = paragraphs.length
        ? paragraphs.map(
            (paragraph) => `<p>${escapeHTML(paragraph)}</p>`
          ).join("")
        : "<p>目前僅提供新聞摘要，完整資料尚待確認。</p>";

      const imageUrl = safeUrl(article.image);

      const coverHTML = imageUrl
        ? `
          <img
            class="article-cover"
            src="${escapeHTML(imageUrl)}"
            alt="${escapeHTML(article.imageAlt || article.title)}"
            onerror="this.style.display='none'"
          >
          <div class="image-credit">
            ${escapeHTML(article.imageCredit || "新聞相關圖片")}
          </div>
        `
        : "";

      const sourceUrl = safeUrl(article.sourceUrl);

      const sourceHTML = sourceUrl
        ? `
          <a
            href="${escapeHTML(sourceUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            查看原始來源 ↗
          </a>
        `
        : "<span>未提供外部來源連結</span>";

      $("articlePage").innerHTML = `
        <a class="back-link" href="#home">
          ← 返回新聞首頁
        </a>

        <div>
          <span class="tag">
            ${escapeHTML(getCategoryName(article.category))}
          </span>

          <h1 class="article-title">
            ${escapeHTML(article.title)}
          </h1>

          <div class="article-meta">
            發布日期：${escapeHTML(formatDate(article.date))}
            ｜資料來源：${escapeHTML(article.source || "未標示")}
          </div>
        </div>

        ${coverHTML}

        <div class="article-summary">
          <strong>新聞重點</strong>
          <p>${escapeHTML(article.summary || "")}</p>
        </div>

        <div class="article-body">
          ${bodyHTML}
        </div>

        <div class="article-source">
          <strong>新聞資料來源</strong>
          <p>${escapeHTML(article.source || "未標示來源")}</p>
          ${sourceHTML}
        </div>

        <div class="notice">
          本站內容以可確認的資料整理。
          車輛規格、售價及交通法規，
          請以車廠或主管機關正式公告為準。
        </div>
      `;

      document.title = article.title + "｜MOTOR DAILY";
    }

    /* -----------------------------------
       導覽列狀態
    ----------------------------------- */

    function updateNavigation(category) {
      document.querySelectorAll(".nav-link").forEach((link) => {
        link.classList.toggle(
          "active",
          link.dataset.category === category
        );
      });
    }

    /* -----------------------------------
       網站路由切換
    ----------------------------------- */

    function route() {
      const hash = window.location.hash || "#home";

      if (hash.startsWith("#article/")) {
        const articleId = decodeURIComponent(
          hash.slice("#article/".length)
        );

        renderArticle(articleId);
        updateNavigation("");
      } else {
        let category = "all";

        if (hash.startsWith("#category/")) {
          const requestedCategory = decodeURIComponent(
            hash.slice("#category/".length)
          );

          if (CATEGORY_KEYS.includes(requestedCategory)) {
            category = requestedCategory;
          }
        }

        $("homePage").hidden = false;
        $("articlePage").hidden = true;

        renderNewsList(category);
        updateNavigation(category);

        document.title = category === "all"
          ? "MOTOR DAILY｜車壇日報"
          : getCategoryName(category) + "｜MOTOR DAILY";
      }

      window.scrollTo(0, 0);
    }

    /* -----------------------------------
       驗證新聞資料
    ----------------------------------- */

    function normalizeArticles(rawArticles) {
      if (!Array.isArray(rawArticles)) {
        return [];
      }

      const ids = new Set();

      return rawArticles.filter((article) => {
        if (!article || typeof article !== "object") {
          return false;
        }

        if (!article.id || !article.title) {
          return false;
        }

        if (!CATEGORY_KEYS.includes(article.category)) {
          return false;
        }

        if (ids.has(String(article.id))) {
          return false;
        }

        ids.add(String(article.id));
        return true;
      });
    }

    /* -----------------------------------
       讀取最新新聞 JSON

       GitHub Actions 可以定期更新 news.json，
       HTML 開啟時便會取得最新版本。
    ----------------------------------- */

    async function loadNews() {
      let success = false;

      try {
        const response = await fetch(
          "./news.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("目前沒有新聞資料檔");
        }

        const data = await response.json();

        const articles = normalizeArticles(
          Array.isArray(data) ? data : data.articles
        );

        if (articles.length > 0) {
          state.articles = sortArticles(articles);
          state.demo = false;
          state.updatedAt = data.updatedAt || null;
          success = true;
        }
      } catch (error) {
        console.info(
          "尚未取得外部新聞資料，改用示範內容。",
          error.message
        );
      }

      if (!success) {
        if (!state.articles.length || state.demo) {
          state.articles = sortArticles(demoArticles);
          state.demo = true;
          state.updatedAt = null;
        }
      }

      $("demoNotice").hidden = !state.demo;

      $("updateStatus").textContent = state.demo
        ? "展示模式"
        : "新聞資料已載入";

      if (state.updatedAt && !state.demo) {
        $("updateStatus").textContent =
          "最後更新：" + formatDate(state.updatedAt);
      }

      route();
    }

    /* -----------------------------------
       日期顯示
    ----------------------------------- */

    function renderToday() {
      const today = new Date();

      $("today").textContent =
        new Intl.DateTimeFormat("zh-TW", {
          timeZone: "Asia/Taipei",
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long"
        }).format(today);

      $("footerYear").textContent =
        `© ${today.getFullYear()} MOTOR DAILY`;
    }

    /* -----------------------------------
       啟動網站
    ----------------------------------- */

    function init() {
      renderToday();

      window.addEventListener("hashchange", route);

      loadNews();

      // 頁面保持開啟時，每 15 分鐘重新檢查 JSON。
      // 這不會主動抓取外部新聞；
      // 實際 news.json 由 GitHub Actions 更新。
      setInterval(loadNews, 15 * 60 * 1000);
    }

    init();
  </script>

</body>
</html>
